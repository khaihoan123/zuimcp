# Mail server for local stdio mode only (EMAIL_ADDRESS/EMAIL_PASSWORD in .env).
# Connected accounts store their own host and port.
IMAP_HOST: "imap.example.com"
IMAP_PORT: 993
SMTP_HOST: "smtp.example.com"
SMTP_PORT: 587

# Better Auth (SvelteKit) is the OAuth 2.1 authorization server. This app is
# the resource server: it verifies tokens Better Auth issued, it does not
# issue or manage identity itself.
AUTH_ISSUER: "http://localhost:5173/auth"
AUTH_JWKS_URI: "http://localhost:5173/auth/jwks"
# Bare origin of this server — NOT the resource identifier (see
# RESOURCE_INDICATOR in core/mcp_server.py, which appends MCP_PATH and must match
# MCP_RESOURCE_INDICATOR in frontend/.env).
MCP_RESOURCE_URL: "http://localhost:8000"
# Max MCP tool calls per user per minute, enforced by a sliding-window
# middleware in core/mcp_server.py. Guards against a runaway agent loop.
MCP_RATE_LIMIT_PER_MINUTE: 60

# SSRF guard (core/net.py): refuse mail and Odoo servers on private/internal
# addresses. Set true only when self-hosting with such a server on your own LAN.
ALLOW_PRIVATE_MAIL_HOSTS: false
