[project]
name = "zuimcp"
version = "0.1.0"
description = "ZuiMCP backend — MCP server and API giving AI agents permission-controlled access to email"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "cryptography>=48.0.0",
    "fastapi[standard]>=0.139.0",
    "fastmcp>=3.3.1",
    "httpx>=0.28.1",
    "imap-tools>=1.13.0",
    "psycopg[binary]>=3.3.8",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecation notices raised inside third-party packages, not our code.
filterwarnings = [
    "ignore:.*CallSpec2.*:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
